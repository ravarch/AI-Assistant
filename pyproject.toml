[project]
name = "pij"
version = "0.1.0"
description = "Professional OSINT & Threat Intelligence Scanner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.12.0",
    "typing-extensions>=4.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.20.0",
    "webtypy>=0.1.7",
    # OSINT & Network Utilities (Pure Python compatible)
    "ipwhois>=1.3.0",
    "dnspython>=2.6.0",
    "shodan>=1.31.0",
    "tldextract>=5.1.0",
    "aiohttp>=3.9.0" 
]

[dependency-groups]
dev = [
    "workers-py",
    "pytest"
]
