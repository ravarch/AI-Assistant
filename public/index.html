<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUX // RESEARCH STATION</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        void: '#030304',
                        panel: '#0C0C0E',
                        border: '#1F1F23',
                        brand: { DEFAULT: '#FF2A6D', dim: 'rgba(255, 42, 109, 0.1)' },
                        accent: { DEFAULT: '#05D9E8', dim: 'rgba(5, 217, 232, 0.1)' },
                        warn: '#FFB800'
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #030304; color: #E0E0E0; }
        .glass-panel { background: rgba(12, 12, 14, 0.8); backdrop-filter: blur(12px); border: 1px solid #1F1F23; }
        .cyber-input { background: rgba(0,0,0,0.3); border: 1px solid #333; transition: all 0.2s; }
        .cyber-input:focus { border-color: #05D9E8; outline: none; box-shadow: 0 0 15px rgba(5, 217, 232, 0.1); }
        /* Matrix Grid Background */
        .bg-grid { background-image: radial-gradient(#1f1f23 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>

<body class="font-sans min-h-screen flex flex-col bg-grid" x-data="app()">

    <nav class="fixed top-0 w-full z-50 glass-panel border-b-white/5 h-16 flex items-center justify-between px-6">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-brand rounded-sm flex items-center justify-center text-void font-bold font-mono text-xl">R</div>
            <span class="font-mono font-bold tracking-tight text-white">FLUX<span class="text-brand">.RESEARCH</span></span>
        </div>
        <div class="flex items-center gap-4 text-xs font-mono">
            <div class="flex items-center gap-2 px-3 py-1.5 rounded bg-white/5 border border-white/10">
                <span class="text-gray-400">STORAGE:</span>
                <span class="text-accent">CLOUDFLARE R2</span>
            </div>
        </div>
    </nav>

    <main class="flex-1 pt-24 pb-12 px-4 md:px-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <aside class="lg:col-span-4 space-y-6">
            
            <div class="glass-panel p-6 rounded-xl space-y-5 border-l-2 border-l-brand">
                <div class="flex justify-between items-end">
                    <label class="text-xs font-mono text-brand uppercase">Research Subject</label>
                    <span class="text-[10px] text-gray-500 font-mono">V 2.0.1</span>
                </div>
                
                <textarea x-model="concept" rows="3" 
                          class="cyber-input w-full p-4 rounded-lg font-mono text-sm text-white placeholder-gray-700 resize-none"
                          placeholder="e.g. 'A futuristic city built inside a giant tree'"></textarea>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-mono text-gray-500 uppercase block mb-1">Model Engine</label>
                        <select x-model="model" class="cyber-input w-full px-3 py-2 rounded text-xs text-accent bg-black">
                            <option value="schnell">FLUX 1 SCHNELL (Fast)</option>
                            <option value="dev">FLUX 2 DEV (Detail)</option>
                            <option value="klein">FLUX 2 KLEIN (Balanced)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] font-mono text-gray-500 uppercase block mb-1">Steps</label>
                        <input type="number" x-model.number="steps" class="cyber-input w-full px-3 py-2 rounded text-xs" min="4" max="50">
                    </div>
                </div>

                <div class="pt-2">
                    <button @click="startResearch" :disabled="working || !concept"
                            class="w-full py-4 cyber-input bg-white/5 hover:bg-brand hover:text-void hover:border-brand transition text-xs font-mono uppercase font-bold tracking-widest flex items-center justify-center gap-2 group">
                        <i class="ph-bold ph-brain" :class="working ? 'animate-pulse' : ''"></i>
                        <span x-text="working ? 'PROCESSING...' : 'INITIATE DEEP RESEARCH'"></span>
                    </button>
                </div>
            </div>

            <div x-show="analysis" x-transition class="glass-panel p-5 rounded-xl border-l-2 border-l-accent space-y-3">
                <h3 class="text-xs font-mono text-accent uppercase flex items-center gap-2">
                    <i class="ph-bold ph-read-cv-logo"></i> Analysis Log
                </h3>
                <p class="text-xs text-gray-400 font-mono leading-relaxed" x-text="analysis"></p>
                <div class="h-px bg-white/10 my-2"></div>
                <h3 class="text-xs font-mono text-gray-500 uppercase">Optimized Prompt</h3>
                <p class="text-xs text-white font-mono bg-black/30 p-2 rounded border border-white/5" x-text="prompt"></p>
            </div>

        </aside>

        <section class="lg:col-span-8 h-full min-h-[600px]">
            <div class="glass-panel w-full h-full rounded-xl flex items-center justify-center relative overflow-hidden p-1">
                
                <div x-show="!result && !working" class="text-center space-y-4 opacity-30">
                    <i class="ph-duotone ph-aperture text-6xl"></i>
                    <p class="font-mono text-sm tracking-widest">AWAITING INPUT</p>
                </div>

                <div x-show="working" class="absolute inset-0 z-20 bg-void/90 backdrop-blur-sm flex flex-col items-center justify-center space-y-4">
                    <div class="relative">
                        <div class="w-16 h-16 border-t-2 border-brand rounded-full animate-spin"></div>
                        <div class="absolute inset-0 border-r-2 border-accent rounded-full animate-spin" style="animation-direction: reverse; animation-duration: 3s"></div>
                    </div>
                    <p class="font-mono text-xs text-accent animate-pulse" x-text="statusText"></p>
                </div>

                <template x-if="result">
                    <div class="relative w-full h-full group">
                        <img :src="result.url" class="w-full h-full object-contain rounded-lg shadow-2xl">
                        
                        <div class="absolute top-4 right-4 flex gap-2">
                            <a :href="result.url" target="_blank" class="p-2 bg-black/50 backdrop-blur text-white rounded border border-white/10 hover:bg-accent hover:text-void transition">
                                <i class="ph-bold ph-arrow-square-out"></i>
                            </a>
                            <a :href="result.url" download class="p-2 bg-black/50 backdrop-blur text-white rounded border border-white/10 hover:bg-brand hover:text-void transition">
                                <i class="ph-bold ph-download"></i>
                            </a>
                        </div>

                        <div class="absolute bottom-4 left-4 right-4">
                            <div class="bg-black/80 backdrop-blur p-4 rounded border border-white/10 flex justify-between items-center">
                                <div>
                                    <div class="text-[10px] text-gray-500 font-mono uppercase">Model Used</div>
                                    <div class="text-xs text-accent font-mono" x-text="result.model.split('/').pop()"></div>
                                </div>
                                <div>
                                    <div class="text-[10px] text-gray-500 font-mono uppercase">Resolution</div>
                                    <div class="text-xs text-white font-mono">1024x1024</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </section>
    </main>

    <script>
        function app() {
            return {
                concept: '',
                prompt: '',
                analysis: '',
                model: 'schnell',
                steps: 4,
                working: false,
                statusText: '',
                result: null,

                async startResearch() {
                    this.working = true;
                    this.result = null;
                    this.analysis = '';
                    
                    try {
                        // Phase 1: Deep Research
                        this.statusText = 'AGENT THINKING...';
                        const resResearch = await fetch('/api/research', {
                            method: 'POST',
                            body: JSON.stringify({ prompt: this.concept })
                        });
                        const dataResearch = await resResearch.json();
                        this.analysis = dataResearch.analysis || "Analysis complete.";
                        this.prompt = dataResearch.prompt || this.concept;

                        // Phase 2: Generation
                        this.statusText = `GENERATING ON ${this.model.toUpperCase()}...`;
                        const resGen = await fetch('/api/generate', {
                            method: 'POST',
                            body: JSON.stringify({ 
                                prompt: this.prompt, 
                                steps: this.steps,
                                model: this.model 
                            })
                        });
                        
                        const dataGen = await resGen.json();
                        if(dataGen.error) throw new Error(dataGen.error);
                        
                        this.result = dataGen;

                    } catch (e) {
                        alert('Error: ' + e.message);
                    } finally {
                        this.working = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
